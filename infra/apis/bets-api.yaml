apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bets-api
  annotations:
    kubernetes.io/ingress.class: "kong"
    konghq.com/override: do-not-preserve-host
    konghq.com/preserve-host: "false"
    # konghq.com/plugins: iodc-bets,rate-limit-kong,prometheus-bets
spec:
  rules:
    - http:
        paths:
          - path: "/api/bets"
            pathType: Prefix
            backend:
              service:
                name: bets
                port:
                  number: 9999
